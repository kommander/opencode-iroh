[package]
name = "opencode-iroh"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
napi = { version = "=3.15.0", default-features = false, features = ["napi8", "async"] }
napi-derive = "=3.6.13"
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "sync"] }

[dev-dependencies]
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
