name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  # The napi-rs cross gcc (glibc 2.17) does not predefine __ARM_ARCH, which ring's assembly requires.
  CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: -x }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: -x }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.napi-rs
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: mlugg/setup-zig@v2
        if: matrix.flags == '-x'
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: matrix.flags == '-x'
        with:
          tool: cargo-zigbuild
      - run: bun install --frozen-lockfile
      - run: bun run build --target ${{ matrix.target }} ${{ matrix.flags }}
        shell: bash
      - name: Check generated loader and declarations are committed
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: git diff --exit-code index.js index.d.ts
      - run: ls -l iroh.*.node
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: iroh.*.node
          if-no-files-found: error

  test:
    name: test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - run: cargo build --example relay
      - run: bun test

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: bunx napi create-npm-dirs && bun run artifacts
      - name: Point optionalDependencies at this release's platform tarballs
        shell: node {0}
        run: |
          const fs = require("fs")
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}`
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
          pkg.optionalDependencies = {}
          for (const dir of fs.readdirSync("npm")) {
            const { name, version } = JSON.parse(fs.readFileSync(`npm/${dir}/package.json`, "utf8"))
            pkg.optionalDependencies[name] = `${base}/${name.slice(1).replace("/", "-")}-${version}.tgz`
          }
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
      - run: |
          mkdir dist
          for dir in npm/*/; do cp LICENSE "$dir" && npm pack "./$dir" --pack-destination dist; done
          npm pack --pack-destination dist
          ls -l dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
